name: CI

on:
  # Every branch. Production has shipped from feature branches that no CI run
  # ever touched; a branch allow-list is how that happened.
  push:
    branches: ["**"]
  pull_request:
  # A new advisory against unchanged main must surface without waiting for a push.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs of a branch or pull request are cancelled; every main commit finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Required check on main. Pull requests here come from forks, so the job runs for
    # every pull request under this one name.
    name: typecheck + tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # Upgrade tests use the verified public source-only fixture.
          persist-credentials: false

      - name: Setup Bun
        # QSEC-008: pin Bun to keep CI reproducible. Bump deliberately when
        # ready to validate against a new runtime.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11 # Must match the distributed runtime and its license notice.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Validate repository instruction paths
        run: bun run ops:validate-agent-paths -- --workspace . --instruction CLAUDE.md

      - name: Module boundaries
        run: bun run ops:check-boundaries

      - name: Lint
        run: bun run lint

      - name: Lint (V4.1 strict, warnings are errors)
        run: bun run lint:v41

      - name: Generated locale runtime matches its catalog
        run: bun scripts/build-ui-locales.ts --check

      - name: Release metadata consistency
        run: |
          python3 scripts/check-release-metadata.py
          python3 tests/test_release_metadata.py

      - name: Release health monitor tests
        run: |
          python3 tests/test_release_health.py
          python3 tests/test_sync_source_mirror.py

      - name: Public explanation parity and discovery guardrails
        run: |
          python3 scripts/discovery-content.py --check
          python3 tests/test_discovery.py
          python3 tests/test_visibility_providers.py
          python3 tests/test_discovery_cycle.py

      - name: Tests
        # Durable SQLite/backup fixtures can exceed Bun's 5s local default on
        # shared runners. Functional assertions and the 10-minute job cap stay
        # intact; performance budgets are checked by the separate V4 gate.
        run: bun test --timeout 30000

      - name: Storage-full failure mode (isolated database)
        timeout-minutes: 1
        run: bun run test:storage-full

      - name: Bounded V4 qualification
        run: |
          mkdir -p artifacts/v4/evidence/P09-ci
          bun test benchmarks/v4
          # 5,000 realistic 0.5-3 KB background notes: corpus-size costs show up in recall latency.
          bun run benchmarks/v4/run.ts --baseline v3 --candidate v4-flags-off --scales 1 --runs 3 --seed 400 --background-notes 5000 --json artifacts/v4/evidence/P09-ci/off.json
          bun run benchmarks/v4/run.ts --baseline v3 --candidate v4-flags-on --scales 1 --runs 3 --seed 400 --holdout --background-notes 5000 --json artifacts/v4/evidence/P09-ci/on.json
          bun run benchmarks/v4/gate.ts --budgets docs/v4/performance-budgets.json --reports artifacts/v4/evidence/P09-ci

      - name: Upload V4 qualification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qoopia-v4-qualification
          path: artifacts/v4/evidence/P09-ci/*.json

  advisories:
    # Live advisory feed: a newly published advisory must not hide whether the
    # commit's own tests pass.
    name: ${{ github.event_name == 'pull_request' && 'dependency advisories (fork pull request)' || 'dependency advisories' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11 # Must match the distributed runtime and its license notice.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency advisories
        run: bun audit

      - name: OSV-Scanner (bun.lock)
        # A second advisory source next to bun audit. Built from the pinned module through the Go
        # checksum database, so no unverified release binary runs here.
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          "$(go env GOPATH)/bin/osv-scanner" scan --lockfile=bun.lock

      - name: Vendored pdf.js version
        run: bun run sec:vendored-pdfjs

  mcp-conformance:
    # The official MCP server conformance suite against a throw-away server started from this
    # commit (scripts/mcp-conformance-fixture.ts). Known, explained failures are the baseline.
    name: ${{ github.event_name == 'pull_request' && 'MCP conformance (fork pull request)' || 'MCP conformance' }}
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11 # Must match the distributed runtime and its license notice.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: MCP server conformance (expected failures in .github/conformance/server-baseline.yml)
        run: >-
          bun scripts/mcp-conformance-fixture.ts --out "$RUNNER_TEMP/mcp-conformance" --
          npx -y @modelcontextprotocol/conformance@0.1.16 server --url '{AUTHED_MCP}'
          --expected-failures "$GITHUB_WORKSPACE/.github/conformance/server-baseline.yml"

  linux-bundle:
    # Release inputs (Debian packages, model, cloudflared) come from the network;
    # a daily test-fixture build shows a vanished or changed input the day it breaks.
    name: linux-x64 test-fixture bundle
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11 # Must match the distributed runtime and its license notice.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build a test-fixture Linux bundle
        run: bun run bundle:build --test-fixture --out "$RUNNER_TEMP/qoopia-bundle"
