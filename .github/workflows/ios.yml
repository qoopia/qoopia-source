name: iOS
on:
  push:
    # Tag pushes ignore path filters; branches only keeps release tags off macOS runners.
    branches: ['**']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    # Same-repo pull requests reuse the push run (see ci.yml).
    name: ${{ github.event_name == 'pull_request' && 'simulator (fork pull request)' || 'simulator' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          git rev-parse HEAD
      - name: Validate and build iPhone app
        run: bash ios/scripts/check.sh
      - name: Build Release for device without signing
        run: xcodebuild -project ios/Qoopia.xcodeproj -scheme Qoopia -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build-device CODE_SIGNING_ALLOWED=NO build
      - name: Capture native iPhone states
        run: bash ios/scripts/capture-simulator.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qoopia-ios-simulator-${{ github.sha }}
          path: ios/build/evidence/
          if-no-files-found: warn
