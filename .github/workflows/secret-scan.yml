name: Secret scan

# A workflow of its own so the public source export carries it as well: the canonical ci.yml is replaced
# there by a public-maintained one, while every other workflow file is exported unchanged.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    # Every commit of the history, not just the diff: a credential committed and later deleted is
    # still published by a push. Triaged findings: .gitleaks.toml (tree) and .gitleaksignore (history).
    name: ${{ github.event_name == 'pull_request' && 'secret scan (fork pull request)' || 'secret scan' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (every commit)
        # Built from the pinned module through the Go checksum database. A fresh checkout equals
        # HEAD, whose every line some scanned commit introduced, so a separate `dir` scan adds nothing.
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .
